<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookolection</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="">Alterar Dados de Livro</a>
        <a href="">Listar Todos os Livros</a>
        <a href="">Pesquisar Livro</a>
    </nav>
    <div class="cadastro">
        <h1>Cadastrar Livro</h1>
        <p>INSIRA OS DADOS E CADASTRE UM LIVRO NOVO</p>
        <form action="" method="post">
            <div class="campos">
                <label for="">Nome</label>
                <input type="text" name="nome" id="nome">                
            </div>
            <div class="campos">
                <label for="">Data de Publicação</label>
                <input type="date" name="data_publicação" id="data_publicacao">
            </div>
            <div class="campos">
                <label for="">Autor</label>
                <input type="text" name="autor" id="autor">
            </div>
            <div class="campos">
                <label for="">Editora</label>
                <input type="text" name="editora" id="editora">
            </div>
            <div class="campos">
                <label for="">Número de Páginas</label>
                <input type="number" name="num_paginas" id="num_paginas">
            </div>
            <div class="campos">
                <label for="">Categoria</label>
                <select name="categoria" id="categoria">
                    <option value="0">--vazio--</option>
                    <option value="av">Aventura</option>
                    <option value="ds">Distopia</option>
                    <option value="ft">Fantasia</option>
                    <option value="fc">Ficcção Científica</option>
                    <option value="if">Infantil</option>
                    <option value="li">Literário</option>
                    <option value="rm">Romance</option>
                    <option value="sp">Suspense</option>
                    <option value="tr">Terror</option>
                </select>
            </div>
            <div class="campos">
                <label for="">Quantidade</label>
                <input type="number" value="1" name="quantidade" id="quantidade">
            </div>
            <input class="botao" type="submit" onclick="validar()">
        </form>
    </div>
</body>
</html>
